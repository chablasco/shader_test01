<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Shader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script>
    let myShader;
    let quadBuffer;

    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      myShader = createShader(vertShader, fragShader);
    }

    function draw() {
      shader(myShader);
      myShader.setUniform("iTime", millis() / 1000.0);
      myShader.setUniform("iResolution", [width, height]);

      // Draw a full-screen quad in clip space
      beginShape(TRIANGLES);
      vertex(-1, -1, 0);
      vertex(1, -1, 0);
      vertex(1, 1, 0);

      vertex(-1, -1, 0);
      vertex(1, 1, 0);
      vertex(-1, 1, 0);
      endShape();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function mousePressed() {
      fullscreen(!fullscreen());
    }

    const vertShader = `
      attribute vec3 aPosition;
      varying vec2 vUv;

      void main() {
        vUv = (aPosition.xy + 1.0) * 0.5;
        gl_Position = vec4(aPosition, 1.0);
      }
    `;

    const fragShader = `
    precision mediump float;

uniform float iTime;
uniform vec2 iResolution;
uniform vec2 iMouse;
varying vec2 vUv;

#define t iTime
#define r iResolution.xy

void main() {
    vec2 fragCoord = vUv * r;
    vec2 mouse = iMouse / r;

    vec3 c;
    float l, z = t;

    float waveIntensity = mix(0.5, 3.0, mouse.x);      // mouseX controls wave frequency
    float reflectionSharpness = mix(0.005, 0.05, mouse.y); // mouseY controls reflection sharpness

    for (int i = 0; i < 3; i++) {
        vec2 uv, p = fragCoord.xy / r;
        uv = p;
        p -= 0.5;
        p.x *= r.x / r.y;
        z += 0.07;
        l = length(p);
        uv += p / l * (sin(z * waveIntensity) + 1.0) * abs(sin(l * 9.0 * waveIntensity - z - z));
        c[i] = reflectionSharpness / length(mod(uv, 1.0) - 0.5);
    }

    gl_FragColor = vec4(c / l, 1.0);
}
    `;
  </script>
</body>
</html>
