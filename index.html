<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Shader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script>
    let myShader;
    let quadBuffer;

    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      myShader = createShader(vertShader, fragShader);
    }

    function draw() {
      shader(myShader);
      myShader.setUniform("iTime", millis() / 1000.0);
      myShader.setUniform("iResolution", [width, height]);

      // Draw a full-screen quad in clip space
      beginShape(TRIANGLES);
      vertex(-1, -1, 0);
      vertex(1, -1, 0);
      vertex(1, 1, 0);

      vertex(-1, -1, 0);
      vertex(1, 1, 0);
      vertex(-1, 1, 0);
      endShape();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function mousePressed() {
      fullscreen(!fullscreen());
    }

    const vertShader = `
      attribute vec3 aPosition;
      varying vec2 vUv;

      void main() {
        vUv = (aPosition.xy + 1.0) * 0.5;
        gl_Position = vec4(aPosition, 1.0);
      }
    `;

    const fragShader = `
precision mediump float;

uniform float iTime;
uniform vec2 iResolution;
uniform vec2 iMouse;
varying vec2 vUv;

#define t iTime
#define r iResolution.xy

void main() {
    vec2 uv = vUv;
    vec2 fragCoord = uv * r;
    vec2 mouse = iMouse / r;

    vec3 c = vec3(0.0);
    float z = t;
    float bubbleTrail = 0.0;

    vec2 p = uv - mouse; // vector from mouse
    p.x *= r.x / r.y;
    float dist = length(p);

    // Bubble shape falloff
    float bubble = 0.1 / (dist + 0.01);  // more intense closer to center

    // Animate waves inside the bubble
    float wave = sin(20.0 * dist - t * 5.0) * 0.5 + 0.5;
    bubble *= wave;

    // Final color composition
    c += vec3(bubble, bubble * 0.6, bubble * 0.9);

    gl_FragColor = vec4(c, 1.0);
}
    `;
  </script>
</body>
</html>
