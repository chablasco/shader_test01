<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Shader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script>
    let myShader;
    let quadBuffer;

    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      myShader = createShader(vertShader, fragShader);
    }

    function draw() {
      shader(myShader);
      myShader.setUniform("iTime", millis() / 1000.0);
      myShader.setUniform("iResolution", [width, height]);

      // Draw a full-screen quad in clip space
      beginShape(TRIANGLES);
      vertex(-1, -1, 0);
      vertex(1, -1, 0);
      vertex(1, 1, 0);

      vertex(-1, -1, 0);
      vertex(1, 1, 0);
      vertex(-1, 1, 0);
      endShape();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function mousePressed() {
      fullscreen(!fullscreen());
    }

    const vertShader = `
      attribute vec3 aPosition;
      varying vec2 vUv;

      void main() {
        vUv = (aPosition.xy + 1.0) * 0.5;
        gl_Position = vec4(aPosition, 1.0);
      }
    `;

    const fragShader = `
precision mediump float;

uniform float iTime;
uniform vec2 iResolution;
uniform vec2 iMouse;
varying vec2 vUv;

void main() {
  vec2 uv = vUv;
  vec2 res = iResolution;
  vec2 mouse = iMouse / res;

  vec2 center = mouse;
  vec2 p = uv - center;

  // Adjust aspect ratio
  p.x *= res.x / res.y;

  float len = length(p);

  // Swirl based on distance and mouse
  float angle = atan(p.y, p.x) + 2.0 * sin(len * 20.0 - iTime * 2.0);
  float radius = pow(len, 0.5);

  vec2 swirl = vec2(cos(angle), sin(angle)) * radius;

  // Modulate by mouseX
  swirl *= 1.0 + 0.5 * sin(iTime + mouse.x * 10.0);

  // Reflections by repeating space
  vec2 repeated = mod(swirl, 0.2) - 0.1;

  float brightness = 0.01 / length(repeated);
  vec3 color = vec3(brightness * 0.8, brightness * 0.5, brightness);

  gl_FragColor = vec4(color, 1.0);
}
    `;
  </script>
</body>
</html>
